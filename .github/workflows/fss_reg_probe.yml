name: FSS regulation template probe
on:
  push:
    branches: [fix/fss-reg-body-4405-4425]
    paths: ['.github/workflows/fss_reg_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install requests beautifulsoup4
      - name: Read two public templates
        run: |
          python - <<'PY'
          import json, requests, time
          from bs4 import BeautifulSoup
          for source_id in ('4405', '4425'):
              url = 'https://www.fss.or.kr/fss/job/lrgRegItnPrvntc/view.do?lrgSlno=' + source_id + '&menuNo=200489&pageIndex=1'
              response = requests.get(url, timeout=(10,30))
              response.raise_for_status()
              soup = BeautifulSoup(response.content, 'html.parser')
              body = soup.select_one('.krds-reg.reg2')
              attachments = soup.select('.attach-file-box a.btn-attach-download')
              assert body is not None
              print('FSS_REG_FIXTURE ' + json.dumps({'source_id':source_id, 'status':response.status_code, 'body':str(body), 'attachments':[str(a) for a in attachments]}, ensure_ascii=False))
              time.sleep(2)
          PY
