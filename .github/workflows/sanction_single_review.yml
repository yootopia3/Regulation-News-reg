name: Sanction Single Review

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: Existing queued article UUID (no automatic enqueue or publication)
        required: true
        type: string
      master_fingerprint:
        description: Expected active duty master SHA-256
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: sanction-private-automation
  cancel-in-progress: false

jobs:
  review-one:
    if: github.ref == 'refs/heads/main' && vars.SANCTION_AUTOMATION_ENABLED == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-inspections.txt
      - name: Analyze the sole queued target for administrator review
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_V2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_V2 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_INSPECTION_MODEL: ${{ vars.OPENAI_INSPECTION_MODEL }}
          OPENAI_INSPECTION_POLICY_CONFIRMED: ${{ vars.OPENAI_INSPECTION_POLICY_CONFIRMED }}
          SANCTION_INSPECTIONS_ENABLED: 'true'
          TARGET_ARTICLE_ID: ${{ inputs.article_id }}
          EXPECTED_MASTER_FINGERPRINT: ${{ inputs.master_fingerprint }}
        run: python -m src.services.sanction_inspections.single_review
