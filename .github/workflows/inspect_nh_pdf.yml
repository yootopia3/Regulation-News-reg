name: Inspect official NH PDF final pages
on:
  push:
    branches: [ops/nh-evidence-reprocess]
    paths: [.github/workflows/inspect_nh_pdf.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 090d7f65d20f7e1dcc3200c255403800c19c7672
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-inspections.txt
      - name: Extract only final public pages without credentials
        run: |
          python -u - <<'PY'
          import json
          from src.services.sanction_inspections.download import download_pdf
          from src.services.internal_documents.worker import parse_isolated
          url="https://www.fss.or.kr/fss.hpdownload?path=/dtm/opn/&file=202500199_14_%EC%A0%9C%EC%9E%AC%EB%82%B4%EC%9A%A9+%EA%B3%B5%EA%B0%9C%28%EA%B2%BD%EC%98%81%EC%9C%A0%EC%9D%98%EA%B0%9C%EC%84%A0%29_%EB%86%8D%ED%98%91%EC%9D%80%ED%96%89_%EC%B5%9C%EC%A2%85.pdf"
          parsed=parse_isolated(download_pdf(url),module='src.services.sanction_inspections.pdf_parser',suffix='.pdf')
          assert not parsed.get('error')
          for page in parsed['pages']:
              if page['number']>=12:
                  print('OFFICIAL_PUBLIC_PAGE',json.dumps(page,ensure_ascii=False),flush=True)
          
          PY
