name: Diagnose NH citation mismatch only
on:
  push:
    branches: [ops/nh-evidence-reprocess]
    paths: [.github/workflows/diagnose_nh_citations.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 090d7f65d20f7e1dcc3200c255403800c19c7672
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-inspections.txt
      - name: Compare public citations without changing jobs or loading private data
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_V2 }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_V2 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_INSPECTION_MODEL: ${{ vars.OPENAI_INSPECTION_MODEL }}
          OPENAI_INSPECTION_POLICY_CONFIRMED: ${{ vars.OPENAI_INSPECTION_POLICY_CONFIRMED }}
          SANCTION_INSPECTIONS_ENABLED: 'true'
        run: |
          python -u - <<'PY'
          import json, unicodedata
          from src.db.client import get_supabase_client
          from src.services.sanction_inspections.client import InspectionClient, Settings
          from src.services.sanction_inspections.download import download_pdf
          from src.services.internal_documents.worker import parse_isolated
          from src.services.sanction_inspections.engine import public_findings, normalized
          from src.services.sanction_inspections.models import Page, InspectionError
          TARGETS = [{"article_id":"bd496848-06ef-40be-a22a-291873527a7a","agency":"FSS_MGMT_NOTICE"},{"article_id":"d12befd7-25cb-4eb6-a949-81d16e263495","agency":"FSS_SANCTION"}]
          db=get_supabase_client()
          client=InspectionClient(Settings.from_env())
          client.settings.check()
          for target in TARGETS:
              try:
                  article=db.table('articles').select('analysis_result').eq('id',target['article_id']).single().execute().data
                  parsed=parse_isolated(download_pdf(article['analysis_result']['pdf_url']),module='src.services.sanction_inspections.pdf_parser',suffix='.pdf')
                  pages=[Page(**p) for p in parsed['pages']]
                  known={p.number:normalized(p.text) for p in pages}
                  class Observed:
                      def __init__(self):
                          self.results=[]
                      def generate(self,instruction,data,schema):
                          result=client.generate(instruction,data,schema)
                          self.results.append(result)
                          invalid=[]
                          for f in result.findings:
                              for e in f.evidence:
                                  quote=normalized(e.quote)
                                  if len(quote)<8 or quote not in known.get(e.page,''):
                                      invalid.append({'finding':f.id,'page':e.page,'length':len(quote),
                                      'page_exists':e.page in known,
                                      'any_page_match':any(quote in text for text in known.values()),
                                      'nfkc_match':unicodedata.normalize('NFKC',quote) in unicodedata.normalize('NFKC',known.get(e.page,'')),
                                      'nonspace_missing_characters':len(set(quote)-set(known.get(e.page,'')))})
                          changed=[]
                          if len(self.results)==2:
                              first=self.results[0].findings
                              changed=[field for field in ['id','title','summary'] if [getattr(f,field) for f in first]!=[getattr(f,field) for f in result.findings]]
                          print('PUBLIC_DIAGNOSTIC',json.dumps({'agency':target['agency'],'pass':len(self.results),'findings':len(result.findings),'invalid':invalid,'changed_fields':changed}),flush=True)
                          return result
                  observed=Observed()
                  try:
                      public_findings(pages,observed)
                      print('PUBLIC_CHECK_PASSED',target['agency'],flush=True)
                  except InspectionError as exc:
                      print('PUBLIC_CHECK_FAILED',target['agency'],str(exc),flush=True)
              except Exception:
                  raise SystemExit('public_diagnostic_failed') from None
          
          PY
